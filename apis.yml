name: Swapcard
kind: company
description: Swapcard is an AI-powered event and community engagement platform for
  in-person, virtual, and hybrid events - mobile and web event apps, attendee
  networking and matchmaking, exhibitor and lead management, registration, and
  onsite badging. For developers Swapcard is GraphQL-first - an organizer-facing
  Content (Event Admin) API to fetch, create, modify, and delete event content
  (events, people, exhibitors, plannings/sessions, groups); an Exhibitor Leads
  API to retrieve booths, export leads, and scan badges; and a GraphQL Analytics
  API. Access is token-based and provisioned to Swapcard customers and partners
  (organizers and exhibitors).

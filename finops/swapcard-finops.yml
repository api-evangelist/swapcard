meters:
- name: annual_subscription
  description: Annual platform subscription (Event Engagement and/or Registration & Management).
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - platform
- name: event_contacts
  description: Event Contacts (attendees and/or exhibitors) included and consumed during the subscription term; in-term top-ups possible.
  unit: contacts
  aggregation: sum
  dimensions:
  - account
  - event
- name: licensed_users
  description: Per-user licensing for organizer/staff seats.
  unit: users
  aggregation: sum
  dimensions:
  - account
- name: implementation_services
  description: One-time onboarding/implementation and professional services fees.
  unit: engagement
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track annual commitment, Event Contact consumption per event, and licensed-user counts against the contract; the API itself adds no separate line item.
- name: Allocation
  description: Map Event Contact usage and add-ons to specific events, teams, or clients so platform spend is attributable.
- name: Optimization
  description: Right-size Event Contact volume to actual attendance/exhibitors, consolidate events onto one subscription, and avoid mid-term volume overages by forecasting demand.
- name: Accountability
  description: Assign an owner for the Swapcard contract; review Event Contact burn-down and renewal terms before each event cycle.

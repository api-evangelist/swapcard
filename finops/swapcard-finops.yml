description: >-
  FinOps view of Swapcard spend. Swapcard is an annual SaaS subscription, not a
  usage-metered public API. Cost is driven by the platform package (Event
  Engagement and/or Registration & Management), the volume of Event Contacts
  (attendees and/or exhibitors) consumed during the term, the number of licensed
  users, optional add-ons/upgrades, and one-time implementation/onboarding fees.
  The developer APIs (Content, Leads, Analytics) carry no separate per-call
  charge - they are included with the subscription and gated by access tokens.
  There is no invoice for the API itself.
notes: >-
  Per-unit rates and Event Contact allowances are quote-based and not reconciled
  here; verify with Swapcard sales (https://www.swapcard.com/pricing). Model
  spend as an annual commitment plus potential in-term volume top-ups and
  implementation services rather than as consumption-based API billing.
